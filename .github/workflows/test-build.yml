# The test build for a player: a fix on top of the newest published release (its base: a Stable, or
# a beta that came out after it), built as the base's own release APK (package com.pd2launcher.app,
# its versionName and versionCode, the release key), so that it installs over the base and the base
# installs over it, in place, both ways, and the next release updates it. About shows "<version> (test <label>)" (build.sh: PD2_TEST_BUILD), and
# the logs name its commit. It publishes nothing: the APK, its .sha256 and its R8 mapping are one
# artifact of the run, for 7 days. Reading the artifact needs a GitHub login.
#
# To start it, push a branch test/<label> or test/<label>-<words> that starts from the base's
# commit (the label is digits, the issue's number: test/13-taskset gives "0.3.8 (test 13)"; 0.3.8 is the first Stable that can show it).
# The branch carries this file. The apk job then waits for the owner's approval (environment
# test-build), and only that job reads the release key.
#
# The build jobs are release.yml's: the reusable workflow build.yml, with the same part packages on
# ghcr.io (each named by the part's identity) and the same base image, so a branch pulls every part
# whose inputs are those of an earlier build. A part whose inputs differ is built once and pushed as
# a package of its own. The apk job's steps up to the build are release.yml's apk job's: a change
# of one belongs in the other.
name: Test build

on:
  push:
    branches: ['test/**']

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The test's label and base release.
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      label: ${{ steps.test.outputs.label }}
      base: ${{ steps.test.outputs.base }}
    steps:
      # The whole history: the branch must start at the base's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The label from the branch's name, and the base: the newest published release, a Stable or a
      # beta (owner, 2026-11-12). The branch starts at its commit, names its versionName, and can
      # show the label.
      - name: Find the label and the base release
        id: test
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $BRANCH =~ ^test/([0-9]{1,8})(-[0-9A-Za-z-]+)?$ ]] ||
            { echo "::error::the branch $BRANCH is not test/<label> or test/<label>-<words> (the label is the issue's number)"; exit 1; }
          label=${BASH_REMATCH[1]}
          base=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not)] | max_by(.published_at) | .tag_name')
          version=$(sed -n 's/^ *versionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts)
          [[ v$version == "$base" ]] ||
            { echo "::error::the commit's versionName is ${version:-unknown}, not the newest release's ${base#v}: start the branch from its commit"; exit 1; }
          git merge-base --is-ancestor "$(git rev-parse "refs/tags/$base^{commit}")" HEAD ||
            { echo "::error::the branch does not start at the commit of $base"; exit 1; }
          if ! grep -q PD2_TEST_BUILD build.sh || ! grep -q pd2.testBuild app/build.gradle.kts; then
            echo "::error::this tree cannot show a test label (PD2_TEST_BUILD): the release is older than 0.3.8"; exit 1
          fi
          echo "The commits on top of $base:"
          git log --oneline "$base..HEAD"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "A test build of $base, label $label, commit $GITHUB_SHA."

  build:
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      commit: ${{ github.sha }}

  apk:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The release key's secrets are the environment test-build's, which waits for the owner's
    # approval before this job starts, so no other job can read them.
    environment: test-build
    permissions:
      contents: read
      packages: read
    env:
      LABEL: ${{ needs.tag.outputs.label }}
      BASE: ${{ needs.tag.outputs.base }}
    steps:
      # Not persisted: no step here uses Git's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-sdk

      # The build jobs' outputs: the userland's assets, the runtime and the system-driver servers
      # from their packages on ghcr.io, the engine that the arm64 job attested in this run from its
      # artifact. build.sh release checks each of them again.
      - name: Pull the userland, the runtime and the system-driver servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          containers/part-image.sh login
          containers/part-image.sh fetch --need userland runtime devdriver

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: ${{ runner.temp }}/in

      - name: Unpack the attested engine
        run: tar --zstd -xf "$RUNNER_TEMP/in/engine.tar.zst" -C ~

      # Named by the files that decide what Gradle downloads: verification-metadata.xml lists every
      # artifact (Gradle refuses any other), so a new dependency changes the name, and a new
      # versionName does not. Apart from the Checks' cache, which a debug build fills first.
      - name: Restore the Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pd2-android/gradle/caches
            ~/.cache/pd2-android/gradle/wrapper
          key: gradle-release-${{ hashFiles('gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: gradle-release-

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [[ -n $KEYSTORE_BASE64 && -n $KEYSTORE_PASSWORD && -n $KEY_ALIAS ]] ||
            { echo "the release key's secrets are not set" >&2; exit 1; }
          signing=$RUNNER_TEMP/signing
          install -d -m 0700 "$signing"
          umask 077
          base64 --decode <<<"$KEYSTORE_BASE64" > "$signing/release.jks"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > "$signing/release-signing.properties"
          echo "PD2_RELEASE_SIGNING_DIR=$signing" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        run: PD2_GRADLE_ON_HOST=1 PD2_TEST_BUILD=$LABEL ./build.sh release

      - name: Remove the release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      # The APK must replace the base in place, and the base must replace it: the same package,
      # versionName, versionCode and certificate as the base release's APK (a beta's APK name
      # ends with its versionCode).
      - name: Name the APK and check it
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools() { "$ANDROID_HOME/build-tools/36.0.0/$1" "${@:2}"; }
          badging=$(tools aapt2 dump badging build/outputs/app-release.apk | head -n 1)
          version_name=$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")
          version_code=$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
          certificate=$(tools apksigner verify --print-certs build/outputs/app-release.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ -n $version_name && -n $version_code && -n $certificate ]]
          [[ $package == com.pd2launcher.app ]] ||
            { echo "::error::the APK's package is ${package:-unknown}, not com.pd2launcher.app"; exit 1; }
          [[ v$version_name == "$BASE" ]] ||
            { echo "::error::the APK's versionName is $version_name, not the base release's ${BASE#v}"; exit 1; }
          gh release download "$BASE" --repo "$GITHUB_REPOSITORY" --pattern "pd2-launcher-android-$version_name*.apk" --dir base
          base_apks=(base/*.apk)
          [[ ${#base_apks[@]} == 1 ]] ||
            { echo "::error::the release $BASE has ${#base_apks[@]} APKs, not one"; exit 1; }
          base_badging=$(tools aapt2 dump badging "${base_apks[0]}" | head -n 1)
          base_code=$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<<"$base_badging")
          base_certificate=$(tools apksigner verify --print-certs "${base_apks[0]}" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ $version_code == "$base_code" ]] ||
            { echo "::error::the APK's versionCode is $version_code, not the base's $base_code"; exit 1; }
          [[ $certificate == "$base_certificate" ]] ||
            { echo "::error::the APK's certificate is $certificate, not the base's $base_certificate"; exit 1; }
          unzip -p build/outputs/app-release.apk 'classes*.dex' | grep -aqF "$version_name (test $LABEL)" ||
            { echo "::error::the APK does not show \"$version_name (test $LABEL)\""; exit 1; }
          apk=pd2-launcher-android-$version_name-test-$LABEL.apk
          mkdir -p test-build
          cp build/outputs/app-release.apk "test-build/$apk"
          (cd test-build && sha256sum "$apk" > "$apk.sha256")
          # R8's mapping of this build, for the stack traces in the player's logs (retrace).
          grep -q '^# pg_map_id: ' app/build/outputs/mapping/release/mapping.txt ||
            { echo "::error::the build wrote no R8 mapping (app/build/outputs/mapping/release/mapping.txt)"; exit 1; }
          cp app/build/outputs/mapping/release/mapping.txt "test-build/${apk%.apk}-mapping.txt"
          cat "test-build/$apk.sha256"
          echo "Package $package, versionName $version_name, versionCode $version_code, certificate $certificate, commit $GITHUB_SHA."
          echo "name=${apk%.apk}" >> "$GITHUB_OUTPUT"

      # One artifact, named as the APK without .apk, which holds the APK, its .sha256 file and
      # its mapping.
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: test-build/
          if-no-files-found: error
          retention-days: 7

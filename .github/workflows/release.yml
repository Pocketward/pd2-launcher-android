# The release build. Each export is one commit on main whose message is its
# version (vX.Y.Z or vX.Y.Z-betaN). A push to main whose commit carries that
# version's tag builds and publishes that release; a push to main whose commit
# has no tag yet is a release candidate, built into a draft release (below);
# workflow_dispatch builds a given tag again, or main's head as a candidate.
# Running on main keeps the build caches where every later release can use them
# (a tag's own caches serve only that tag).
#
#   engine    engine/build.sh: the release build of the engine, without its
#             window, from the sources that engine.lock pins (their SHA-256
#             checked), unless the cache holds the build for these inputs
#   userland  userland/build.sh with our glibc, unless the cache holds the
#             archive for these inputs. The userland's parts are cached apart,
#             together: the glibc, Xvfb, Mesa and PanVK builds (each reused while
#             its BUILDINFO names the current inputs), PanVK's host tools, the
#             Debian packages and the source archives
#   wine      beside the userland job: the runtime's parts that do not need the
#             userland (runtime/wine.sh, wowbox64.sh and pd2audio.sh) and the .NET
#             downloads, cached under a key made from their inputs, unless that
#             cache holds them or the cache holds the runtime for its inputs; in
#             every run, it checks the pinned engine's XInput bridge against
#             runtime/config.sh
#   runtime   after the userland and wine jobs: runtime/build.sh, which reuses the
#             wine job's parts by their BUILDINFO, makes the prefix template with
#             the userland's tree (unpacked from the userland's archive) and packs
#             the runtime, unless the cache holds the runtime for its inputs
#   apk       the engine job's build, build.sh release signed with the release
#             key from the secrets of the environment "release", which only this
#             job names, then the GitHub release with the APK, its .sha256 file and
#             R8's mapping.txt of the same build. build.sh release requires the
#             release lint check before exporting the APK
#
# Every build image is cached on its own, as an archive named by the image's tag,
# which hashes its Containerfile and pins: the scripts load a missing image from
# its archive (PD2_IMAGE_ARCHIVE) instead of building it again, and the jobs
# save only an archive that a script made.
#
# Every job builds the one commit the tag named when the tag job looked, which
# must be on main and which the tag must still name when the release is
# published; the APK's versionName must be the tag's, and a release that
# already has files is not overwritten (a person deletes them first).
#
# A release candidate is built in the same way before its tag exists: the push
# of an export commit to main without a tag (its message names the version), or
# workflow_dispatch on main with candidate set (gh workflow run release.yml
# --ref main -f tag=vX.Y.Z -f candidate=true), which builds main's head and
# needs its message to be the tag. Every job builds that commit, which must
# still be on main; the tag must still not exist when the APK is published on a
# draft release of the tag that targets that commit (a draft's files are
# replaced, and a newer candidate moves its target). The engine's release that
# engine.lock pins may be a draft too, without its tag: the engine, wine and
# runtime jobs then fetch its sources by the pinned commit (PD2_ENGINE_UNRELEASED).
# Publishing the draft after its test makes the tag on that commit; that builds
# nothing, because the tag's release is published with its files.
#
# The release notes' lines that the build writes are a block between two
# markers, which also records (hidden) the commit the APK was built from, its
# SHA-256 and the SHA-256 of its mapping.txt; a build writes that block again and
# keeps any text outside it.
# A candidate whose tree differs from the commit its draft's APK was built from
# only in Markdown files and docs/ (an export of the documents alone; owner,
# 2026-10-29: "if we are just changing markdown files never rebuild"), or that the
# draft's APK was built from, builds nothing: the draft job moves the draft to
# this commit with the APK that was tested and keeps its notes (workflow_dispatch
# with rebuild set builds it anyway). keep-caches.yml reads the caches below
# every few days, so GitHub does not remove them between releases (after 7 days
# without a read); it names their paths too, so a path changed here must change
# there.
#
# While the engine's repository is private, the secret ENGINE_REPO_TOKEN (read
# access to its contents) lets Git and the GitHub CLI fetch from it; a public
# one needs none.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish
        required: true
      candidate:
        description: Build main's head as a draft release, before the tag exists (its commit message must be the tag)
        type: boolean
        default: false
      rebuild:
        description: With candidate, build even when the draft holds the APK built for main's head (or for an earlier commit that differs only in Markdown files and docs/)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The markers of the release notes' block that the build writes (Publish the release), in
  # which the draft job reads the build's record.
  NOTES_BEGIN: '<!-- ci-notes:begin (each build writes this block again; notes outside it stay) -->'
  NOTES_END: '<!-- ci-notes:end -->'
  # The runtime's parts that the wine job builds (in parts/: Wine, wowbox64.dll and the sound
  # plugin) and the runtime's downloads, as the wine and runtime jobs cache and restore them.
  WINE_PARTS: |
    ~/.cache/pd2-android/runtime/parts
    ~/.cache/pd2-android/runtime/dl

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      candidate: ${{ steps.tag.outputs.candidate }}
      userland: ${{ steps.keys.outputs.userland }}
      runtime: ${{ steps.keys.outputs.runtime }}
      engine: ${{ steps.keys.outputs.engine }}
      wine: ${{ steps.keys.outputs.wine }}
      image_tools: ${{ steps.keys.outputs.image_tools }}
      image_mesa: ${{ steps.keys.outputs.image_mesa }}
      image_panvk: ${{ steps.keys.outputs.image_panvk }}
      image_glibc: ${{ steps.keys.outputs.image_glibc }}
      image_wine: ${{ steps.keys.outputs.image_wine }}
      image_runtime_tools: ${{ steps.keys.outputs.image_runtime_tools }}
    steps:
      # The whole history: the release's commit must be on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          # The published release of a tag as JSON, nothing when there is none (HTTP 404); any other
          # error fails. gh writes an error's body to standard output.
          published() {
            local body
            if body=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" 2>/dev/null); then
              echo "$body"
            elif [[ $(jq -r '.status // empty' <<<"$body" 2>/dev/null) != 404 ]]; then
              echo "cannot read the release $1: $body" >&2
              return 1
            fi
          }
          candidate=
          # A candidate: main's head, before its tag exists, built on request.
          if [[ $INPUT_CANDIDATE == true ]]; then
            [[ $GITHUB_REF == refs/heads/main ]] ||
              { echo "a candidate is built on main, not $GITHUB_REF" >&2; exit 1; }
            [[ $INPUT_TAG =~ $pattern ]] || { echo "not a release tag: $INPUT_TAG" >&2; exit 1; }
            message=$(git log -1 --format=%s "$GITHUB_SHA")
            [[ $message == "$INPUT_TAG" ]] ||
              { echo "main's head $GITHUB_SHA is the export of ${message:-nothing}, not $INPUT_TAG" >&2; exit 1; }
            refs=$(git ls-remote --tags origin "refs/tags/$INPUT_TAG")
            [[ -z $refs ]] || { echo "the tag $INPUT_TAG exists; a candidate is built before its tag" >&2; exit 1; }
            release=$(published "$INPUT_TAG")
            [[ -z $release ]] || { echo "the release $INPUT_TAG is published" >&2; exit 1; }
            tag=$INPUT_TAG
            candidate=true
          elif [[ -n $INPUT_TAG ]]; then
            [[ $INPUT_TAG =~ $pattern ]] || { echo "not a release tag: $INPUT_TAG" >&2; exit 1; }
            git ls-remote --exit-code --tags origin "refs/tags/$INPUT_TAG" >/dev/null ||
              { echo "no tag $INPUT_TAG" >&2; exit 1; }
            tag=$INPUT_TAG
          else
            # An export commit's message is its version, and one whose tag does not exist is a
            # candidate: that is known at once, without waiting for a tag. (A tag pushed with its
            # export commit is there already; if it came late, the draft job stops before any
            # build, and workflow_dispatch with the tag builds the release.)
            message=$(git log -1 --format=%s "$GITHUB_SHA")
            refs=
            [[ ! $message =~ $pattern ]] || refs=$(git ls-remote --tags origin "refs/tags/$message")
            if [[ $message =~ $pattern && -z $refs ]]; then
              release=$(published "$message")
              if [[ -z $release ]]; then
                tag=$message
                candidate=true
              else
                echo "$message has a published release already: nothing to build"
              fi
            else
              # Any other commit is built when a tag names it. The tag arrives with the commit; look
              # twice more in case it is a moment late.
              for attempt in 1 2 3; do
                tag=$(git ls-remote --tags origin 'refs/tags/v*' |
                  awk -v commit="$GITHUB_SHA" '$1 == commit { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' |
                  grep -E "$pattern" | sort -uV | tail -n 1 || true)
                [[ -n $tag || $attempt == 3 ]] && break
                sleep 10
              done
              if [[ -n $tag ]]; then
                # A release whose files are published already is not built again: a published
                # candidate, whose draft put the tag on its commit, among them.
                release=$(published "$tag")
                files=0
                [[ -z $release ]] || files=$(jq '.assets | length' <<<"$release")
                if [[ $files != 0 ]]; then
                  echo "the release $tag is published with $files files: nothing to build"
                  tag=
                fi
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (not a release)}${candidate:+ (a candidate)}"

      # The commit the tag names now is the one every job builds, whatever the tag names later;
      # only a commit on main, where a release is reviewed, is released. A candidate's is the
      # commit the run started from, which must still be on main.
      - name: Check out the release
        id: release
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CANDIDATE: ${{ steps.tag.outputs.candidate }}
        run: |
          if [[ -n $CANDIDATE ]]; then
            git fetch -q origin "+refs/heads/main:refs/remotes/origin/main"
            commit=$GITHUB_SHA
            git merge-base --is-ancestor "$commit" refs/remotes/origin/main ||
              { echo "::error::$commit is no longer on main"; exit 1; }
          else
            git fetch -q origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
            commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            git merge-base --is-ancestor "$commit" refs/remotes/origin/main ||
              { echo "::error::$TAG names $commit, which is not on main"; exit 1; }
          fi
          git checkout -q --detach "$commit"
          echo "commit=$commit" | tee -a "$GITHUB_OUTPUT"

      # The userland's cache key, from the release's tree before any build writes into it: it
      # covers every input of its version (userland/pack.sh) and more, leaving out only the
      # build's out/ folders and the READMEs. The runtime's covers its own folder and the
      # userland's (its prefix template is made with the userland); the XInput bridge that the
      # template takes from the engine's sources is pinned by its size and SHA-256 in
      # runtime/config.sh. The engine's covers its pin, engine/ (the build script and the build
      # image's Containerfile) and userland/config.sh (the image's Debian pins).
      # The wine job's parts are named by their inputs: the identities that wine.sh, wowbox64.sh
      # and pd2audio.sh write into each part's BUILDINFO, and the .NET pins.
      # Each build image's archive by the name the scripts give it (image_archive in
      # userland/config.sh), without .tar.zst, which names its cache too: the image's tag hashes
      # its Containerfile and pins.
      - name: Name the caches
        id: keys
        if: steps.tag.outputs.tag != ''
        run: |
          # A command that fails inside $(...) stops the step too.
          set -o pipefail
          shopt -s inherit_errexit
          echo "userland=userland-${{ hashFiles('userland/**', '!userland/**/out*/**', '!**/*.md', '!userland/mesa-update.sh') }}" |
            tee -a "$GITHUB_OUTPUT"
          echo "runtime=runtime-${{ hashFiles('runtime/**', 'userland/**', '!userland/**/out*/**', '!**/*.md') }}" |
            tee -a "$GITHUB_OUTPUT"
          echo "engine=engine-${{ hashFiles('engine.lock', 'engine/**', 'userland/config.sh') }}" |
            tee -a "$GITHUB_OUTPUT"
          wine=$({
            runtime/wine.sh --identity
            runtime/wowbox64.sh --identity
            runtime/pd2audio.sh --identity
            (. runtime/config.sh && echo "dotnet=$DOTNET_RUNTIME_URL $DOTNET_RUNTIME_SHA512 $DOTNET_DESKTOP_URL $DOTNET_DESKTOP_SHA512")
          } | sha256sum | cut -d' ' -f1)
          [[ $wine =~ ^[0-9a-f]{64}$ ]]
          echo "wine=runtime-parts-$wine" | tee -a "$GITHUB_OUTPUT"
          (
            . runtime/config.sh
            # shellcheck disable=SC2034 # read by image_archive (userland/config.sh)
            PD2_IMAGE_ARCHIVE=.
            # The image of a Containerfile that build-mesa.sh or runtime_image (runtime/config.sh)
            # builds, under the tag they give it.
            tagged() { echo "localhost/$1:$( (cat "$2"; echo "$DEBIAN_IMAGE $DEBIAN_SNAPSHOT") | sha256sum | cut -c1-16)"; }
            name() { # output image
              local stem
              stem=$(basename "$(image_archive "$2")" .tar.zst)
              [[ $stem =~ ^localhost_[a-z0-9-]+_[0-9a-f]{16}$ ]] || { echo "no archive name for $1: $stem" >&2; return 1; }
              echo "$1=$stem"
            }
            image=$(tools_image_name)
            name image_tools "$image"
            image=$(tagged pd2-userland-mesa userland/containers/Containerfile.mesa)
            name image_mesa "$image"
            image=$(panvk_image_name)
            name image_panvk "$image"
            image=$(glibc_image_name)
            name image_glibc "$image"
            image=$(tagged pd2-runtime-wine runtime/containers/Containerfile.wine)
            name image_wine "$image"
            image=$(tagged pd2-runtime-tools runtime/containers/Containerfile.tools)
            name image_runtime_tools "$image"
          ) | tee -a "$GITHUB_OUTPUT"

  # A candidate keeps its draft's APK, which was tested, when the APK was built from this commit
  # or from an earlier commit of main that differs from it only in Markdown files and docs/: the draft
  # then targets this commit (its files and notes stay) and the build jobs are skipped. The
  # notes' block that the build wrote records that commit, the APK's SHA-256 and its mapping's,
  # and the APK, its .sha256 file and the mapping must all match it: files that a build uploaded
  # but did not record (it stopped before its notes) are never reused, and a draft without the
  # mapping of its APK is built again. Only main's head is a candidate here: a run of an
  # older export (a re-run) stops without changing anything, as it would move the draft back. Any
  # other release, a candidate that cannot reuse its draft, and workflow_dispatch with rebuild
  # set are built.
  draft:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A draft release is visible only with write access.
    permissions:
      contents: write
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.tag.outputs.candidate == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse the draft's tested APK
        id: reuse
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          COMMIT: ${{ needs.tag.outputs.commit }}
          CANDIDATE: ${{ needs.tag.outputs.candidate }}
          REBUILD: ${{ inputs.rebuild }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          # Why the draft's APK cannot be reused for this commit, nothing when it can. An error fails
          # (on standard error, which the caller does not capture).
          why_not() {
            local release body record build sum mapping_sum digest sums
            if ! release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,body,assets 2>"$RUNNER_TEMP/view.err"); then
              [[ $(<"$RUNNER_TEMP/view.err") == "release not found" ]] ||
                { echo "cannot read the release $TAG: $(<"$RUNNER_TEMP/view.err")" >&2; exit 1; }
              echo "$TAG has no draft yet"
              return
            fi
            [[ $(jq -r .isDraft <<<"$release") == true ]] || { echo "the release $TAG is not a draft"; return; }
            body=$(jq -r '.body // ""' <<<"$release") || { echo "cannot read the notes of the release $TAG" >&2; exit 1; }
            # The build's record, <!-- ci-build commit=<commit> apk-sha256=<SHA-256>
            # mapping-sha256=<SHA-256> --> on one line, read only between the first begin marker and
            # the end marker after it, the block a build writes. A record without the mapping is
            # from a build before the mapping went on the release.
            record=$(tr -d '\r' <<<"$body" |
              awk -v begin="$NOTES_BEGIN" -v end="$NOTES_END" '
                $0 == begin && !inside { inside = 1; next }
                inside && $0 == end { printf "%s", block; exit }
                inside { block = block $0 "\n" }' |
              sed -n 's/^<!-- ci-build commit=\([0-9a-f]\{40\}\) apk-sha256=\([0-9a-f]\{64\}\) mapping-sha256=\([0-9a-f]\{64\}\) -->$/\1 \2 \3/p' |
              head -n 1)
            [[ -n $record ]] || { echo "the draft's notes record no build with its mapping"; return; }
            read -r build sum mapping_sum <<<"$record"
            if [[ $build != "$COMMIT" ]]; then
              if ! git cat-file -e "$build^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$build" "$COMMIT"; then
                echo "the draft's APK was built from $build, which is not an earlier commit of main"
                return
              fi
              git diff --quiet "$build" "$COMMIT" -- . ':(exclude)*.md' ':(exclude)docs' ||
                { echo "this candidate changes more than Markdown files and docs/ since $build, which the draft's APK was built from"; return; }
            fi
            digest=$(jq -r --arg name "$APK" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")
            [[ $digest == "sha256:$sum" ]] || { echo "the draft's $APK is not the APK its notes record"; return; }
            sums=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK.sha256" --output - 2>/dev/null) ||
              { echo "the draft has no $APK.sha256"; return; }
            [[ $(cut -d' ' -f1 <<<"$sums") == "$sum" ]] ||
              { echo "the draft's $APK.sha256 is not the SHA-256 its notes record"; return; }
            digest=$(jq -r --arg name "$MAPPING" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")
            [[ $digest == "sha256:$mapping_sum" ]] || { echo "the draft's $MAPPING is not the mapping its notes record"; return; }
          }
          APK=pd2-launcher-android-${TAG#v}.apk
          MAPPING=pd2-launcher-android-${TAG#v}-mapping.txt
          reuse=false
          if [[ $CANDIDATE == true ]]; then
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            [[ $head == "$COMMIT" ]] ||
              { echo "::error::a newer export replaced this candidate: main's head is ${head:-unknown}, not $COMMIT; nothing is built and the draft $TAG is not changed"; exit 1; }
            # Before any build: a candidate is published only before its tag exists. This also
            # finds a tag that was pushed with its export commit but came too late for the tag job.
            refs=$(git ls-remote origin "refs/tags/$TAG")
            [[ -z $refs ]] ||
              { echo "::error::the tag $TAG exists now; a candidate is published before its tag (workflow_dispatch with tag=$TAG builds the tag's release)"; exit 1; }
            if [[ $REBUILD == true ]]; then
              echo "building the candidate: a rebuild was asked for"
            else
              why=$(why_not)
              if [[ -n $why ]]; then
                echo "building the candidate: $why"
              else
                target=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
                if [[ $target == "$COMMIT" ]]; then
                  echo "::notice title=Tested draft kept::the draft $TAG targets $COMMIT already, with its tested $APK: nothing to do"
                else
                  gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" >/dev/null
                  echo "::notice title=Tested draft reused::$COMMIT changes only Markdown files and docs/ since the commit the draft's $APK was built from: the draft $TAG keeps that tested APK and its notes and targets $COMMIT now (before: $target); nothing is built"
                fi
                reuse=true
              fi
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  # The engine, built from the sources that engine.lock pins, unless the cache holds the build for
  # these inputs (the tag job names it). The build image is kept as an archive in a cache of its
  # own, named by the image's tag, which hashes its Containerfile and the Debian pins.
  engine:
    needs: [tag, draft]
    if: needs.tag.outputs.tag != '' && needs.draft.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # A candidate's engine may be a draft release, without its tag yet: engine/build.sh then
    # fetches the pinned commit by its SHA.
    env:
      PD2_ENGINE_UNRELEASED: ${{ needs.tag.outputs.candidate == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false

      - name: Restore the engine
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/engine-release-out
          key: ${{ needs.tag.outputs.engine }}

      - name: Name the engine's build image
        id: image
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          image=$(engine/build.sh --image)
          echo "key=engine-image-${image##*:}" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the engine's build image
        id: image-cache
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/engine
          key: ${{ steps.image.outputs.key }}

      # The built engine attests its identity once, under qemu-user.
      - name: Install a static qemu-aarch64 binfmt_misc handler
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends qemu-user-static
          grep -q '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Build the engine
        if: steps.engine.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
          PD2_RELEASE_BUILD: 1
        run: |
          url=$(sed -n 's/^url=//p' engine.lock)
          git ls-remote "$url" HEAD >/dev/null || {
            echo "::error::cannot read $url; while it is private, the secret ENGINE_REPO_TOKEN must give read access to it"
            exit 1
          }
          PD2_IMAGE_ARCHIVE=~/.cache/pd2-android/images/engine engine/build.sh

      # Only an image this run built; also when a later step failed.
      - name: Save the engine's build image
        if: ${{ !cancelled() && steps.engine.outputs.cache-hit != 'true' && steps.image-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/engine
          key: ${{ steps.image.outputs.key }}

      - name: Save the engine
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/engine-release-out
          key: ${{ needs.tag.outputs.engine }}

  # The userland, unless the cache holds it for these inputs (the tag job names it). Its build
  # images: the tools, Mesa and PanVK images, and glibc's, which only its build needs.
  userland:
    needs: [tag, draft]
    if: needs.tag.outputs.tag != '' && needs.draft.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PARTS: |
        userland/glibc/out
        ~/.cache/pd2-android/userland/debs
        ~/.cache/pd2-android/userland/sources
        ~/.cache/pd2-android/userland/mesa-out
        ~/.cache/pd2-android/userland/xvfb-out
        ~/.cache/pd2-android/kbase/sources
        ~/.cache/pd2-android/kbase/out
        ~/.cache/pd2-android/kbase/work/host-tools-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false

      - name: Restore the userland
        id: userland
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/userland
          key: ${{ needs.tag.outputs.userland }}

      # In the background: deleting is slow, and the room is needed only later.
      - name: Make room on the disk
        if: steps.userland.outputs.cache-hit != 'true'
        run: |
          df -h / "$GITHUB_WORKSPACE"
          nproc
          free -g
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift >/dev/null 2>&1 &

      - name: Install a static qemu-aarch64 binfmt_misc handler
        if: steps.userland.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends qemu-user-static
          grep -q '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      # Each into the folder the scripts load a missing image from and add an image they build to
      # (PD2_IMAGE_ARCHIVE, userland/config.sh).
      - name: Restore the tools image
        id: image-tools
        if: steps.userland.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_tools }}.tar.zst
          key: image-${{ needs.tag.outputs.image_tools }}

      - name: Restore the Mesa image
        id: image-mesa
        if: steps.userland.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_mesa }}.tar.zst
          key: image-${{ needs.tag.outputs.image_mesa }}

      - name: Restore the PanVK image
        id: image-panvk
        if: steps.userland.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_panvk }}.tar.zst
          key: image-${{ needs.tag.outputs.image_panvk }}

      - name: Restore glibc's image
        id: image-glibc
        if: steps.userland.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_glibc }}.tar.zst
          key: image-${{ needs.tag.outputs.image_glibc }}

      # The newest parts are safe to restore: build-glibc.sh, build-xvfb.sh, build-mesa.sh and
      # build-panvk.sh reuse a build only while its BUILDINFO names the current inputs, and every
      # download is checked by SHA-256.
      - name: Restore the userland's parts
        id: parts
        if: steps.userland.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PARTS }}
          key: userland-parts-${{ needs.tag.outputs.userland }}
          restore-keys: userland-parts-

      - name: Build the userland
        if: steps.userland.outputs.cache-hit != 'true'
        env:
          PD2_USERLAND_WITH_GLIBC: 1
        run: PD2_IMAGE_ARCHIVE=~/.cache/pd2-android/images/userland userland/build.sh

      # Named by what they hold, so the cache takes them again only when a part changed. Kept
      # also when a later step failed: a part's BUILDINFO is written only once it is built.
      - name: Name the userland's parts
        id: parts-key
        if: ${{ !cancelled() && steps.userland.outputs.cache-hit != 'true' }}
        run: |
          . userland/config.sh
          # Host tools of another Mesa commit are of no further use.
          for d in "$PANVK_CACHE"/work/host-tools-*; do
            if [[ -d $d && $d != */host-tools-$PANVK_MESA_COMMIT ]]; then rm -rf "$d"; fi
          done
          # Nor Mesa archives of another pin (mesa-update.sh moves it; each is about 130 MB), nor any
          # in PanVK's cache: build-panvk.sh takes the userland cache's archive. Nor a download that
          # stopped part way (*.part).
          for f in "$USERLAND_CACHE"/sources/mesa-[0-9a-f]*.tar.gz "$USERLAND_CACHE"/sources/mesa-[0-9]*.tar.xz; do
            if [[ -f $f && $(basename "$f") != "$(basename "$MESA_URL")" ]]; then rm -f "$f"; fi
          done
          rm -f "$PANVK_CACHE"/sources/mesa-* "$USERLAND_CACHE"/sources/*.part
          key=$({
            cat userland/glibc/out/BUILDINFO \
              "$USERLAND_CACHE"/mesa-out/BUILDINFO "$USERLAND_CACHE"/xvfb-out/BUILDINFO \
              "$PANVK_CACHE"/out/BUILDINFO "$PANVK_CACHE"/work/host-tools-*/IMAGE 2>/dev/null || true
            find "$USERLAND_CACHE"/debs "$USERLAND_CACHE"/sources "$PANVK_CACHE"/sources \
              -type f -printf '%P %s\n' 2>/dev/null | sort
          } | sha256sum | cut -c1-16)
          echo "key=userland-parts-$key" | tee -a "$GITHUB_OUTPUT"

      - name: Save the userland's parts
        if: ${{ !cancelled() && steps.parts-key.outputs.key != '' && steps.parts-key.outputs.key != steps.parts.outputs.cache-matched-key }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PARTS }}
          key: ${{ steps.parts-key.outputs.key }}

      # An image is saved only when this job built it: its archive is there and its cache had
      # none. Also when a later step failed.
      - name: Find the build images built here
        id: built
        if: ${{ !cancelled() && steps.userland.outputs.cache-hit != 'true' }}
        env:
          TOOLS: ${{ steps.image-tools.outputs.cache-hit != 'true' && needs.tag.outputs.image_tools || '' }}
          MESA: ${{ steps.image-mesa.outputs.cache-hit != 'true' && needs.tag.outputs.image_mesa || '' }}
          PANVK: ${{ steps.image-panvk.outputs.cache-hit != 'true' && needs.tag.outputs.image_panvk || '' }}
          GLIBC: ${{ steps.image-glibc.outputs.cache-hit != 'true' && needs.tag.outputs.image_glibc || '' }}
        run: |
          archive=~/.cache/pd2-android/images/userland
          for image in TOOLS MESA PANVK GLIBC; do
            if [[ -n ${!image} && -f $archive/${!image}.tar.zst ]]; then echo "${image,,}=true"; fi
          done | tee -a "$GITHUB_OUTPUT"

      - name: Save the tools image
        if: ${{ !cancelled() && steps.built.outputs.tools == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_tools }}.tar.zst
          key: image-${{ needs.tag.outputs.image_tools }}

      - name: Save the Mesa image
        if: ${{ !cancelled() && steps.built.outputs.mesa == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_mesa }}.tar.zst
          key: image-${{ needs.tag.outputs.image_mesa }}

      - name: Save the PanVK image
        if: ${{ !cancelled() && steps.built.outputs.panvk == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_panvk }}.tar.zst
          key: image-${{ needs.tag.outputs.image_panvk }}

      - name: Save glibc's image
        if: ${{ !cancelled() && steps.built.outputs.glibc == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_glibc }}.tar.zst
          key: image-${{ needs.tag.outputs.image_glibc }}

      - name: Save the userland
        if: steps.userland.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/userland
          key: ${{ needs.tag.outputs.userland }}

  # Beside the userland job: the runtime's parts that do not need the userland, Wine, Box64's
  # wowbox64.dll and the game's sound plugin (runtime/wine.sh, wowbox64.sh and pd2audio.sh, all in
  # the Wine image), and the .NET downloads, which the runtime job unpacks. Their cache holds only
  # them, under the name the tag job gives it from their inputs. Nothing is built when that cache
  # holds them, or when the cache holds the runtime that needs them. Otherwise the newest earlier
  # parts are restored first: each script reuses a part while its BUILDINFO names the current
  # inputs, and every download is checked by its SHA-256 or SHA-512.
  wine:
    needs: [tag, draft]
    if: needs.tag.outputs.tag != '' && needs.draft.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A candidate's engine may be a draft release, without its tag yet: engine/build.sh --source
    # then fetches the pinned commit by its SHA.
    env:
      PD2_ENGINE_UNRELEASED: ${{ needs.tag.outputs.candidate == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false

      # The prefix template carries the engine's XInput bridge, which runtime/config.sh pins by its
      # size and SHA-256; prefix.sh checks it when it makes the template. The runtime's cache key
      # does not name the engine pin, so the pinned engine's bridge is checked in every run, also
      # when the runtime comes from the cache.
      - name: Check the engine's XInput bridge
        env:
          GH_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          set -o pipefail
          . runtime/config.sh
          src=$(engine/build.sh --source)
          xxd -r -p "$src/src/install/xinput_bridge.hex" | xz -dc > "$RUNNER_TEMP/xinput1_4.dll"
          size=$(stat -c %s "$RUNNER_TEMP/xinput1_4.dll")
          sum=$(sha256sum < "$RUNNER_TEMP/xinput1_4.dll" | cut -d' ' -f1)
          [[ $size == "$XINPUT_BRIDGE_SIZE" && $sum == "$XINPUT_BRIDGE_SHA256" ]] ||
            { echo "::error::the engine's XInput bridge ($size bytes, $sum) is not the one runtime/config.sh pins"; exit 1; }
          echo "the engine's XInput bridge is the pinned one: $size bytes, $sum"

      - name: Look for the runtime
        id: runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/runtime
          key: ${{ needs.tag.outputs.runtime }}
          lookup-only: true

      - name: Look for the parts
        id: parts
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINE_PARTS }}
          key: ${{ needs.tag.outputs.wine }}
          lookup-only: true

      # In the background: deleting is slow, and the room is needed only later.
      - name: Make room on the disk
        if: steps.runtime.outputs.cache-hit != 'true' && steps.parts.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift >/dev/null 2>&1 &

      - name: Restore the Wine image
        id: image-wine
        if: steps.runtime.outputs.cache-hit != 'true' && steps.parts.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_wine }}.tar.zst
          key: image-${{ needs.tag.outputs.image_wine }}

      - name: Restore the newest earlier parts
        if: steps.runtime.outputs.cache-hit != 'true' && steps.parts.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINE_PARTS }}
          key: ${{ needs.tag.outputs.wine }}
          restore-keys: runtime-parts-

      - name: Build the parts
        id: build
        if: steps.runtime.outputs.cache-hit != 'true' && steps.parts.outputs.cache-hit != 'true'
        run: |
          export PD2_IMAGE_ARCHIVE=~/.cache/pd2-android/images/userland
          runtime/wine.sh
          runtime/wowbox64.sh
          runtime/pd2audio.sh
          . runtime/config.sh
          fetch "$DOTNET_RUNTIME_URL" "$DOTNET_RUNTIME_SHA512" >/dev/null
          fetch "$DOTNET_DESKTOP_URL" "$DOTNET_DESKTOP_SHA512" >/dev/null
          # The cache keeps only these parts (the runtime job makes the prefix template and the
          # runtime) and the downloads of the current pins.
          for d in "$RUNTIME_PARTS"/*; do
            case ${d##*/} in
              wine | wowbox64 | pd2audio) ;;
              *) rm -rf "$d" ;;
            esac
          done
          keep=" $(basename "$WINE_URL") $(basename "$LLVM_MINGW_URL") box64-$BOX64_COMMIT.tar.gz"
          keep+=" $(basename "$DOTNET_RUNTIME_URL") $(basename "$DOTNET_DESKTOP_URL") "
          for f in "$RUNTIME_DL"/*; do
            if [[ $keep != *" ${f##*/} "* ]]; then rm -rf "$f"; fi
          done
          du -sh "$RUNTIME_PARTS"/* "$RUNTIME_DL"/*

      # Under the name the tag job gives them only when all were built, as the runtime job and a
      # later run take that name for a whole set. A part's BUILDINFO is written only once it is
      # built, so a failed build keeps what it built under a name of its own, which a later run
      # restores as the newest earlier parts.
      - name: Save the parts
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINE_PARTS }}
          key: ${{ steps.build.outcome == 'success' && needs.tag.outputs.wine || format('{0}-partial-{1}-{2}', needs.tag.outputs.wine, github.run_id, github.run_attempt) }}

      # The runtime job restores the parts by that name: when the save did not happen (it only
      # warns), this job fails, so that a re-run of the failed jobs runs it again.
      - name: Look for the saved parts
        id: saved
        if: steps.build.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINE_PARTS }}
          key: ${{ needs.tag.outputs.wine }}
          lookup-only: true

      - name: Check the saved parts
        if: steps.build.outcome == 'success' && steps.saved.outputs.cache-hit != 'true'
        env:
          KEY: ${{ needs.tag.outputs.wine }}
        run: |
          echo "::error::the cache has no $KEY after the save"
          exit 1

      - name: Find the build images built here
        id: built
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          WINE: ${{ steps.image-wine.outputs.cache-hit != 'true' && needs.tag.outputs.image_wine || '' }}
        run: |
          archive=~/.cache/pd2-android/images/userland
          for image in WINE; do
            if [[ -n ${!image} && -f $archive/${!image}.tar.zst ]]; then echo "${image,,}=true"; fi
          done | tee -a "$GITHUB_OUTPUT"

      - name: Save the Wine image
        if: ${{ !cancelled() && steps.built.outputs.wine == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_wine }}.tar.zst
          key: image-${{ needs.tag.outputs.image_wine }}

  # After the userland and wine jobs, unless the cache holds the runtime for its inputs:
  # runtime/build.sh reuses the wine job's parts by their BUILDINFO, makes the prefix template with
  # the userland's tree and packs the runtime. The tree comes from the userland's archive, which
  # userland/pack.sh packs from that tree as it is. The build images: the Wine image (the wine
  # job saved it when it built one) and the runtime's tools image.
  runtime:
    needs: [tag, userland, wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # A candidate's engine may be a draft release, without its tag yet: engine/build.sh --source
    # (which runtime/prefix.sh runs for the XInput bridge) then fetches the pinned commit by its SHA.
    env:
      PD2_ENGINE_UNRELEASED: ${{ needs.tag.outputs.candidate == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false

      - name: Look for the runtime
        id: runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/runtime
          key: ${{ needs.tag.outputs.runtime }}
          lookup-only: true

      - name: Restore the userland
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/userland
          key: ${{ needs.tag.outputs.userland }}
          fail-on-cache-miss: true

      - name: Restore the wine job's parts
        id: parts
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINE_PARTS }}
          key: ${{ needs.tag.outputs.wine }}

      # Only the whole set: a cache of another name (parts that a failed build kept) would make
      # runtime/build.sh build the missing parts here, without saving them.
      - name: Check the wine job's parts
        if: steps.runtime.outputs.cache-hit != 'true' && steps.parts.outputs.cache-hit != 'true'
        env:
          KEY: ${{ needs.tag.outputs.wine }}
        run: |
          echo "::error::the cache has no $KEY (the wine job's parts); re-run all jobs"
          exit 1

      # In the background: deleting is slow, and the room is needed only later.
      - name: Make room on the disk
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift >/dev/null 2>&1 &

      - name: Install a static qemu-aarch64 binfmt_misc handler
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends qemu-user-static
          grep -q '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Restore the Wine image
        id: image-wine
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_wine }}.tar.zst
          key: image-${{ needs.tag.outputs.image_wine }}

      - name: Restore the runtime's tools image
        id: image-runtime-tools
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_runtime_tools }}.tar.zst
          key: image-${{ needs.tag.outputs.image_runtime_tools }}

      - name: Build the runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          set -o pipefail
          . runtime/config.sh
          # The userland's tree, where prefix.sh looks for it.
          mkdir -p "$USERLAND_TREE"
          zstd -dc app/src/main/assets/userland/userland.tar.zst | tar -x -p -C "$USERLAND_TREE"
          df -h /
          PD2_IMAGE_ARCHIVE=~/.cache/pd2-android/images/userland runtime/build.sh

      - name: Find the build images built here
        id: built
        if: ${{ !cancelled() && steps.runtime.outputs.cache-hit != 'true' }}
        env:
          WINE: ${{ steps.image-wine.outputs.cache-hit != 'true' && needs.tag.outputs.image_wine || '' }}
          RUNTIME_TOOLS: ${{ steps.image-runtime-tools.outputs.cache-hit != 'true' && needs.tag.outputs.image_runtime_tools || '' }}
        run: |
          archive=~/.cache/pd2-android/images/userland
          for image in WINE RUNTIME_TOOLS; do
            if [[ -n ${!image} && -f $archive/${!image}.tar.zst ]]; then echo "${image,,}=true"; fi
          done | tee -a "$GITHUB_OUTPUT"

      - name: Save the Wine image
        if: ${{ !cancelled() && steps.built.outputs.wine == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_wine }}.tar.zst
          key: image-${{ needs.tag.outputs.image_wine }}

      - name: Save the runtime's tools image
        if: ${{ !cancelled() && steps.built.outputs.runtime_tools == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/userland/${{ needs.tag.outputs.image_runtime_tools }}.tar.zst
          key: image-${{ needs.tag.outputs.image_runtime_tools }}

      - name: Save the runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/runtime
          key: ${{ needs.tag.outputs.runtime }}

  apk:
    needs: [tag, engine, userland, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The release key's secrets are the environment's, so no other job can read them.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # Not persisted: the release is published with gh, not git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false

      # The build image (SDK, NDK) needs more room than a hosted runner leaves free. In the
      # background: deleting is slow, and the room is needed only later.
      - name: Make room on the disk
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift >/dev/null 2>&1 &

      # build.sh's image under the name build.sh gives it: its tag hashes the Containerfile.
      - name: Name the build image
        id: image
        run: |
          tag=$(sha256sum containers/Containerfile | cut -c1-16)
          echo "name=localhost/pd2-android-build:$tag" >> "$GITHUB_OUTPUT"
          echo "key=android-image-$tag" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the build image
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/android.tar.zst
          key: ${{ steps.image.outputs.key }}

      # In the background, while the other caches are restored; "Wait for the build image" waits
      # for its exit status.
      - name: Load the build image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: |
          # shellcheck disable=SC2016 # the inner bash expands them
          nohup bash -c 'set -o pipefail
            zstd -dc ~/.cache/pd2-android/images/android.tar.zst | podman load
            echo "$?" > "$RUNNER_TEMP/image-load.status"' > "$RUNNER_TEMP/image-load.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/image-load.pid"

      - name: Restore the userland
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/userland
          key: ${{ needs.tag.outputs.userland }}
          fail-on-cache-miss: true

      - name: Restore the runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/assets/runtime
          key: ${{ needs.tag.outputs.runtime }}
          fail-on-cache-miss: true

      # Named by the files that decide what Gradle downloads: verification-metadata.xml lists every
      # artifact (Gradle refuses any other), so a new dependency changes the name, and a new
      # versionName does not. Apart from the Checks' cache, which a debug build fills first.
      - name: Restore the Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pd2-android/gradle/caches
            ~/.cache/pd2-android/gradle/wrapper
          key: gradle-release-${{ hashFiles('gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-release-
            gradle-

      # The engine job's build; build.sh release checks it against engine.lock again.
      - name: Restore the engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/engine-release-out
          key: ${{ needs.tag.outputs.engine }}
          fail-on-cache-miss: true

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [[ -n $KEYSTORE_BASE64 && -n $KEYSTORE_PASSWORD && -n $KEY_ALIAS ]] ||
            { echo "the release key's secrets are not set" >&2; exit 1; }
          signing=$RUNNER_TEMP/signing
          install -d -m 0700 "$signing"
          umask 077
          base64 --decode <<<"$KEYSTORE_BASE64" > "$signing/release.jks"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > "$signing/release-signing.properties"
          echo "PD2_RELEASE_SIGNING_DIR=$signing" >> "$GITHUB_ENV"

      # Until the load wrote its exit status, or stopped without one, for 15 minutes at most.
      - name: Wait for the build image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: |
          for ((i = 0; i < 900; i++)); do
            if [[ -s $RUNNER_TEMP/image-load.status ]] || ! kill -0 "$(<"$RUNNER_TEMP/image-load.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/image-load.log"
          [[ $(cat "$RUNNER_TEMP/image-load.status" 2>/dev/null) == 0 ]] ||
            { echo "::error::the build image did not load"; exit 1; }

      - name: Build the signed release APK
        run: ./build.sh release

      - name: Remove the release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Keep the build image
        id: image-kept
        if: ${{ !cancelled() && steps.image-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          mkdir -p ~/.cache/pd2-android/images
          podman save "$IMAGE" | zstd -T0 -q -o ~/.cache/pd2-android/images/android.tar.zst

      - name: Save the build image
        if: ${{ !cancelled() && steps.image-kept.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pd2-android/images/android.tar.zst
          key: ${{ steps.image.outputs.key }}

      - name: Name the APK and describe it
        id: apk
        env:
          COMMIT: ${{ needs.tag.outputs.commit }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          tools() { podman run --rm -v "$PWD/build/outputs:/apk:ro" "$IMAGE" "$@"; }
          badging=$(tools aapt2 dump badging /apk/app-release.apk | head -n 1)
          version_name=$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")
          version_code=$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
          certificate=$(tools apksigner verify --print-certs /apk/app-release.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ -n $version_name && -n $version_code && -n $certificate ]]
          [[ v$version_name == "$TAG" ]] ||
            { echo "::error::the APK's versionName is $version_name, not the tag's ${TAG#v}"; exit 1; }
          apk=pd2-launcher-android-$version_name.apk
          mkdir -p release
          cp build/outputs/app-release.apk "release/$apk"
          (cd release && sha256sum "$apk" > "$apk.sha256")
          # R8's mapping.txt of this build (app/proguard-rules.pro): only the mapping of the APK's own
          # build gives the real classes and lines of its stack traces back (retrace), so it goes on
          # the release beside the APK. The app's update check takes only the APK and its .sha256.
          mapping=pd2-launcher-android-$version_name-mapping.txt
          grep -q '^# pg_map_id: ' app/build/outputs/mapping/release/mapping.txt ||
            { echo "::error::the build wrote no R8 mapping (app/build/outputs/mapping/release/mapping.txt)"; exit 1; }
          cp app/build/outputs/mapping/release/mapping.txt "release/$mapping"
          engine_tag=$(sed -n 's/^tag=//p' engine.lock)
          engine_commit=$(sed -n 's/^commit=//p' engine.lock)
          {
            echo "$NOTES_BEGIN"
            echo "PD2 Launcher for Android $TAG."
            echo
            echo "- \`$apk\`: package \`$package\`, versionName $version_name, versionCode $version_code; SHA-256 in \`$apk.sha256\`."
            echo "- Signed with the certificate whose SHA-256 is \`$certificate\`."
            echo "- \`$mapping\`: R8's mapping of this build, which gives the real classes and lines of a stack trace back (retrace)."
            echo "- Engine: PD2 Launcher $engine_tag (\`$engine_commit\`)."
            echo
            echo "<!-- ci-build commit=$COMMIT apk-sha256=$(cut -d' ' -f1 "release/$apk.sha256") mapping-sha256=$(sha256sum < "release/$mapping" | cut -d' ' -f1) -->"
            echo "$NOTES_END"
          } > release/notes.md
          cat release/notes.md

      # The tag may have moved since the tag job looked: the release is published only while it
      # still names the commit built.
      - name: Check the tag still names the release
        if: needs.tag.outputs.candidate != 'true'
        env:
          COMMIT: ${{ needs.tag.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          # An annotated tag names its commit in the peeled entry, a lightweight one directly.
          now=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }' <<<"$refs")
          [[ -n $now ]] || now=$(awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }' <<<"$refs")
          [[ $now == "$COMMIT" ]] ||
            { echo "::error::$TAG names ${now:-nothing} now, not the commit built ($COMMIT)"; exit 1; }

      # A candidate is published as a draft only while its tag does not exist: publishing the
      # draft makes it.
      - name: Check the tag still does not exist
        if: needs.tag.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG")
          [[ -z $refs ]] || { echo "::error::the tag $TAG exists now; a candidate is published before its tag"; exit 1; }

      # The notes' block from NOTES_BEGIN to the first NOTES_END after it is the build's: each
      # build writes it again, and any text outside it stays; notes without that pair of markers
      # keep their text below a new block (with a warning). On an existing release the files are
      # uploaded first, then the notes are read again and the target and notes change in one edit,
      # so the notes record a build only once its files are there. A new draft gets its notes,
      # then its files (gh release create): the draft job's digest check covers a create that
      # stopped half way. A candidate is published only while it is main's head (a newer export
      # replaced it otherwise).
      - name: Publish the release
        env:
          COMMIT: ${{ needs.tag.outputs.commit }}
          CANDIDATE: ${{ needs.tag.outputs.candidate }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          # The release as JSON (isDraft, body, assets), nothing when there is none; any other
          # error fails.
          view() {
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,body,assets 2>"$RUNNER_TEMP/view.err"; then
              [[ $(<"$RUNNER_TEMP/view.err") == "release not found" ]] ||
                { echo "cannot read the release $TAG: $(<"$RUNNER_TEMP/view.err")" >&2; return 1; }
            fi
          }
          # The notes of a release (its JSON) with the build's block written again, in
          # release/notes-new.md.
          renote() { # release JSON
            local body
            body=$(jq -r '.body // ""' <<<"$1")
            rm -f release/notes-missing
            tr -d '\r' <<<"$body" |
              awk -v begin="$NOTES_BEGIN" -v end="$NOTES_END" -v block=release/notes.md -v missing=release/notes-missing '
                { line[NR] = $0; if (NF) text = 1 }
                $0 == begin && !b { b = NR }
                $0 == end && b && !e { e = NR }
                END {
                  if (b && e) for (i = 1; i < b; i++) print line[i]
                  while ((getline l < block) > 0) print l
                  if (b && e) for (i = e + 1; i <= NR; i++) print line[i]
                  else if (text) { print "" > missing; print ""; for (i = 1; i <= NR; i++) print line[i] }
                }' > release/notes-new.md
            if [[ -f release/notes-missing ]]; then
              echo "::warning::the notes of $TAG had no begin and end marker of the build's block: the block is put above them, and their lines stay below it"
            fi
          }
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          files=(release/*.apk release/*.apk.sha256 release/*-mapping.txt)
          if [[ -n $CANDIDATE ]]; then
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            [[ $head == "$COMMIT" ]] ||
              { echo "::error::a newer export replaced this candidate: main's head is ${head:-unknown}, not $COMMIT; the draft $TAG is not changed"; exit 1; }
          fi
          release=$(view)
          if [[ -n $CANDIDATE ]]; then
            # A candidate's files go on a draft release only, which targets the commit built.
            if [[ -n $release ]]; then
              [[ $(jq -r .isDraft <<<"$release") == true ]] ||
                { echo "::error::the release $TAG is published; a candidate replaces the files of a draft only"; exit 1; }
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              release=$(view)
              [[ -n $release ]] || { echo "::error::the draft $TAG went away during the upload"; exit 1; }
              renote "$release"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --notes-file release/notes-new.md
            else
              gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --target "$COMMIT" \
                --title "$TAG" --notes-file release/notes.md "${prerelease[@]}"
            fi
          elif [[ -n $release ]]; then
            # A published APK is never replaced by a build: a person deletes it first.
            assets=$(jq '.assets | length' <<<"$release")
            [[ $assets == 0 ]] ||
              { echo "::error::the release $TAG already has $assets files; delete them to publish it again"; exit 1; }
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
            release=$(view)
            [[ -n $release ]] || { echo "::error::the release $TAG went away during the upload"; exit 1; }
            renote "$release"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes-new.md
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file release/notes.md "${prerelease[@]}"
          fi

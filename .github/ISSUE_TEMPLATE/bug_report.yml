name: Problem report
description: Something does not work in PD2 Launcher for Android.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Logs help us find the problem much faster.** Before you send this report:
        1. In the app, open **Settings → Help** and turn on **Detailed logging**.
        2. Do again what causes the problem.
        3. Open **Settings → Help → Save logs**, save the file, and drag it into "What is the problem?" below.

        Turn Detailed logging off again after you send the logs.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: About shows it.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Samsung Galaxy S24"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "Android 14"
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How is the game set up?
      options:
        - The app installed it
        - I imported a Diablo II folder
        - It is not set up yet
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: "What did you do, what did you expect, and what happened? Attach the logs file here (Settings → Help → Save logs)."
    validations:
      required: true

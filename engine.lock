# The PD2 Launcher engine the APK runs: a release of the desktop Launcher's public
# repository, named by its tag and the commit that tag must point to, and that release's
# ARM64 executable (asset) with its SHA-256. engine/build.sh downloads the executable and
# checks it against this pin (--build builds the release from its sources instead);
# `engine/build.sh --pin <tag>` sets tag, commit and SHA-256 from the repository.
